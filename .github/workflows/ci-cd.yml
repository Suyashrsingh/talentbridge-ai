name: TalentBridge AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-validation:
    name: Backend Lint & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Code & Serverless Handler
        run: |
          python -m py_compile server.py
          python -m py_compile api/index.py
          python -c "from api.index import app; print('FastAPI instance verified:', app.title)"

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build React Application
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html && echo "Frontend build verified successfully!"

  vercel-configuration-check:
    name: Vercel Deployment Readiness Check
    needs: [backend-validation, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Vercel Configuration Files
        run: |
          test -f vercel.json && echo "vercel.json present"
          test -f api/index.py && echo "api/index.py serverless entrypoint present"
          test -f requirements.txt && echo "requirements.txt present"
          echo "All Vercel serverless requirements satisfied!"
